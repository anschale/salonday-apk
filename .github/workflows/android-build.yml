name: Android Build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Decode and write keystore
      run: echo "${{ secrets.KEYSTORE_FILE }}" | base64 -d > android.keystore

    - name: Create gradle.properties with signing config
      run: |
        cat >> gradle.properties << EOF
        android.injected.signing.store.file=android.keystore
        android.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }}
        android.injected.signing.key.alias=${{ secrets.KEY_ALIAS }}
        android.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}
        EOF

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Build and sign APK
      run: ./gradlew assembleRelease

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: apk
        path: app/build/outputs/apk/release/
